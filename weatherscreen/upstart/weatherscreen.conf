# Weather screensaver: run the daemon while the Kindle UI is up, and bring
# it back if it ever dies. Installed by "Weather Screensaver > Enable" in
# KUAL, removed by "Disable".

start on started lab126_gui
stop on stopping lab126_gui

respawn
respawn limit 10 300

pre-start script
    [ -f /var/local/weatherscreen/enabled ] || { stop; exit 0; }
end script

exec /bin/sh /var/local/weatherscreen/app/weatherd.sh
